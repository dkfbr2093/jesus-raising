<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5dfbd">
  <title>예수 키우기</title>
  <style>
    :root{--ink:#4c342c;--red:#b74e47;--cream:#fff9ef;--gold:#e2ad42}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif;background:radial-gradient(circle at 50% 0,#fff9e9,#f3dec0 60%,#e9cda8)}button,input{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;padding:12px 14px 108px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfc9a7}.brand{font-size:22px;font-weight:900;letter-spacing:-.09em}.brand b{color:var(--gold);margin-right:6px}.love{padding:9px 13px;border:1px solid #e8c791;border-radius:999px;background:#fff7eb;color:#a14d47;font-size:13px;font-weight:800}.love strong{font-size:18px;margin-left:5px}.profile{width:39px;height:39px;border:1px solid #e8c791;border-radius:50%;background:#fff7eb;color:#9b5e4d;font-size:18px}.stage{position:relative;height:570px;margin-top:14px;padding-top:32px;overflow:hidden;text-align:center;border:1px solid #efd9b7;border-radius:30px;background:linear-gradient(#fff9ee,#fff1da 73%,#ebca98);box-shadow:inset 0 1px #fff,0 18px 46px #80512422}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,#fff 0 11%,#ffdf746b 33%,transparent 64%)}.stage h1,.stage p{position:relative;z-index:4;margin:0}.eyebrow{color:#bd9271;font-size:10px;font-weight:800;letter-spacing:.17em}.stage h1{margin-top:7px;font-family:Georgia,serif;font-size:38px;letter-spacing:-.1em}.mood{margin-top:8px!important;color:#997363;font-size:13px}.hero{position:relative;z-index:3;width:min(100%,450px);height:410px;margin:2px auto 0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.sprite{position:relative;z-index:2;display:block;width:396px;max-width:100%;height:396px;margin:auto;background:url('jesus-evolution-sprite.png') no-repeat;background-size:200% 500%;filter:drop-shadow(0 18px 11px #80503942);transition:transform .14s}.hero:active .sprite{transform:scale(.95)}.rays{position:absolute;z-index:0;left:50%;top:28px;width:350px;height:350px;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(#edbd535c 0 5deg,transparent 5deg 15deg);opacity:0}.halo{position:absolute;z-index:1;left:50%;top:46px;width:174px;height:56px;transform:translateX(-50%);border:10px solid #edc663;border-radius:50%;box-shadow:0 0 25px #f6d678;opacity:0}.advanced .rays,.advanced .halo{opacity:1}.advanced .rays{animation:spin 13s linear infinite}.burst:after{content:"";position:absolute;z-index:8;left:50%;top:44%;width:12px;height:12px;border-radius:2px;background:#ff6c5e;box-shadow:-154px -125px #ffce53,-112px -172px #64c7ff,-64px -132px #aa7bff,26px -182px #5fd49c,78px -142px #ff7cbe,142px -112px #ffce53,-174px -35px #64c7ff,-104px -59px #ff7cbe,116px -46px #aa7bff,176px 8px #5fd49c,-154px 88px #ffce53,-67px 112px #64c7ff,43px 103px #ff7cbe,138px 79px #aa7bff;animation:confetti 1.45s ease-out both}.ribbon{position:absolute;z-index:4;bottom:34px;left:50%;transform:translateX(-50%);padding:8px 14px;white-space:nowrap;border-radius:99px;background:#fff7e5;color:#a45b48;box-shadow:0 5px 15px #79533d21;font-size:11px;font-weight:700}.gain{position:absolute;z-index:9;color:#c5484d;font-size:20px;font-weight:900;text-shadow:0 2px #fff;animation:gain .85s ease-out forwards}.goal{margin-top:14px;padding:18px 18px 4px;display:grid;grid-template-columns:1fr auto;gap:9px;border-radius:19px;background:#fff9efd4;color:#8e7566;font-size:12px}.goal b{color:#a25148}.bar{grid-column:1/-1;height:9px;overflow:hidden;border-radius:99px;background:#ebddcd}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#c85d54,#f0bc6c);transition:width .3s}.dock{position:fixed;z-index:20;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;display:flex;gap:7px;width:min(650px,calc(100% - 28px));padding:7px;transform:translateX(-50%);border:1px solid #e5ca9d;border-radius:18px;background:#fff9edf5;box-shadow:0 17px 38px #60422131;backdrop-filter:blur(12px)}.stat{display:flex;align-items:center;gap:7px;padding:5px 10px;color:#8a6b58;font-size:11px}.stat small,.stat b{display:block}.stat small{font-size:9px}.stat b{margin-top:3px}.shop-open{flex:1;min-height:53px;border:0;border-radius:14px;background:linear-gradient(135deg,#c45b50,#a33f3c);color:#fffaf1;font-weight:800}.modal{position:fixed;z-index:30;inset:0;display:none;place-items:end center;padding:12px;background:#3d292378;backdrop-filter:blur(6px)}.modal.show{display:grid}.sheet{width:min(680px,100%);padding:20px 15px;max-height:88vh;overflow:auto;border:1px solid #f1d69f;border-radius:25px;background:#fffaf2;box-shadow:0 26px 80px #20130d66}.sheet-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:13px}.sheet h2{margin:0;font-size:25px;letter-spacing:-.06em}.sheet p{margin:5px 0 0;color:#9b8171;font-size:12px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#f5e7d8;color:#8f6c57;font-size:24px}.items{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{min-height:73px;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid #ecdac4;border-radius:14px;background:#fffdf8;text-align:left}.item:disabled{opacity:.55}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#f8eddf;font-size:19px}.item b,.item small{display:block}.item b{font-size:12px}.item small{margin-top:4px;color:#a78c7c;font-size:10px}.cost{padding:6px;border-radius:8px;background:#f9e8dc;color:#b0504a;font-size:10px;font-weight:800}.center-modal{place-items:center;padding:20px}.card{width:min(400px,100%);padding:28px 22px;border:1px solid #f1d69f;border-radius:28px;background:#fffaf2;box-shadow:0 26px 80px #20130d66;text-align:center}.card .spark{color:#d39a33;font-size:28px}.card h1{margin:8px 0;font-family:Georgia,serif;font-size:42px;letter-spacing:-.1em}.card p{margin:0;color:#977565;font-size:14px;line-height:1.65}.start{width:100%;margin-top:24px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#c45b50,#a33f3c);color:#fffaf1;font-weight:900}.nickname{width:100%;margin:22px 0 0;padding:15px;border:1px solid #e5c99b;border-radius:14px;background:#fffdf8;color:var(--ink);text-align:center;font-size:17px;outline-color:#c45b50}.hint{display:block;margin-top:8px;color:#b78a75;font-size:11px}.profile-card{text-align:left}.profile-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#f9e8dc;color:#b0504a;font-size:23px}.profile-title h2{margin:0;font-size:21px}.profile-title small{display:block;margin-top:4px;color:#9b8171}.record-open{width:100%;padding:15px;border:0;border-radius:15px;background:#f5e6d6;color:#965448;font-weight:900;text-align:left}.record-open span{float:right}.record-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.record-head h2{margin:0;font-size:23px}.record-list{max-height:55vh;overflow:auto;margin:0;padding:0;list-style:none;text-align:left}.record-list li{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #efdfca}.record-list i{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:50%;background:#f9e8dc;color:#b0504a;font-size:11px;font-style:normal;font-weight:900}.record-list b,.record-list small{display:block}.record-list small{margin-top:4px;color:#a28473;font-size:11px}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}@keyframes gain{to{opacity:0;transform:translateY(-100px) scale(1.2)}}@keyframes confetti{0%{opacity:0;transform:translate(-50%,0) scale(.2)}16%{opacity:1}100%{opacity:0;transform:translate(-50%,150px) scale(1.25) rotate(280deg)}}@media(max-width:520px){.app{padding:8px 10px 102px}.stage{height:520px;padding-top:28px}.stage h1{font-size:32px}.hero{height:376px}.sprite{width:356px;height:356px}.rays{width:300px;height:300px}.halo{top:42px;width:150px;height:48px;border-width:8px}.stat{display:none}.items{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="modal center-modal show" id="welcome"><section class="card"><div class="spark">✦</div><h1>예수 키우기</h1><p>작은 애정이 모여<br>빛나는 여정이 시작돼요.</p><button class="start" id="start">시작하기</button></section></div>
  <div class="modal center-modal" id="nicknameModal"><section class="card"><div class="spark">♥</div><h1>이름을 알려주세요</h1><p>여정의 기록에 남길<br>나만의 닉네임을 정해요.</p><input class="nickname" id="nickname" maxlength="12" placeholder="닉네임 입력" aria-label="닉네임"><small class="hint">나중에 이 기기에서만 저장돼요.</small><button class="start" id="enter">여정 시작하기</button></section></div>
  <main class="app" id="game" hidden><header class="top"><div class="brand"><b>✦</b>예수 키우기</div><div class="love">♥ 애정도<strong id="love">0</strong></div><button class="profile" id="profile" aria-label="프로필 열기">☺</button></header><section class="stage" id="stage"><p class="eyebrow">현재 모습 · <span id="step">1</span> / 10</p><h1 id="title">작은 등불</h1><p class="mood" id="mood">아직은 조용한 시작</p><button class="hero" id="hero" aria-label="애정도 얻기"><span class="rays"></span><span class="halo"></span><span class="sprite" id="sprite"></span><span class="ribbon" id="ribbon">작은 시작</span></button></section><section class="goal"><span>다음 진화: <b id="next">따뜻한 미소</b></span><span id="remain">60 ♥ 남음</span><div class="bar"><i id="bar" style="width:4%"></i></div></section></main>
  <div class="dock" id="dock" hidden><div class="stat">☀ <span><small>지금의 평온</small><b id="passive">초당 +0 애정도</b></span></div><button class="shop-open" id="open">🎁 마음의 선물 상점 →</button></div>
  <div class="modal" id="modal"><section class="sheet"><div class="sheet-head"><div><h2>마음의 선물</h2><p>선물로 애정도를 더 빠르게 모아보세요.</p></div><button class="close" id="close" aria-label="상점 닫기">×</button></div><div class="items" id="items"></div></section></div>
  <div class="modal center-modal" id="profileModal"><section class="card profile-card"><button class="close" id="profileClose" aria-label="프로필 닫기" style="float:right">×</button><div class="profile-title"><div class="avatar">☺</div><div><h2 id="profileName">여행자</h2><small id="profileSince">오늘 시작한 여정</small></div></div><button class="record-open" id="recordOpen">📜 성장 기록 <span>›</span></button></section></div>
  <div class="modal center-modal" id="recordModal"><section class="card profile-card"><div class="record-head"><h2>성장 기록</h2><button class="close" id="recordClose" aria-label="기록 닫기">×</button></div><ol class="record-list" id="recordList"></ol></section></div>
<script>
const stages=[['작은 등불','아직은 조용한 시작',0],['따뜻한 미소','미소가 피어났어요',60],['길 위의 친구','희망의 길을 걷는 중',200],['마을의 위로','사람들이 모여들어요',600],['평화의 노래','마음에 노래가 번져요',1600],['사랑의 빛','빛이 더 깊어졌어요',4000],['희망의 등대','멀리까지 비추는 마음',10000],['기적의 손길','따뜻함이 세상을 감싸요',24000],['하늘의 평화','구름 위로 피어난 평화',60000],['영원한 사랑','사랑으로 가득 찬 완성',150000]];
const gifts=[['smile','😊','따뜻한 미소','클릭 애정도 +1',15,1,0],['candle','🕯️','기도의 촛불','초당 애정도 +1',70,0,1],['bread','🍞','나눔의 빵','클릭 애정도 +6',280,6,0],['oil','🏺','향유의 단지','초당 애정도 +8',1500,0,8],['halo','✨','황금 후광','클릭 애정도 +30',8000,30,0]];
const key='jesus-raising-pages';let save=JSON.parse(localStorage.getItem(key)||'{}');let love=save.love||0,levels=save.levels||{},previous=0,nickname=save.nickname||'',startedAt=save.startedAt||'',reached=save.reached||{};const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ko-KR'),date=t=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(t));
function persist(){localStorage.setItem(key,JSON.stringify({love,levels,nickname,startedAt,reached}))}function power(){return 1+gifts.reduce((s,g)=>s+g[5]*(levels[g[0]]||0),0)}function passive(){return gifts.reduce((s,g)=>s+g[6]*(levels[g[0]]||0),0)}function price(g){return Math.ceil(g[4]*Math.pow(1.65,levels[g[0]]||0))}function currentStage(){return stages.reduce((a,s,i)=>love>=s[2]?i:a,0)}
function render(){let si=currentStage(),s=stages[si],n=stages[si+1];if(nickname&&!reached[si]){reached[si]=new Date().toISOString()}$('love').textContent=fmt(love);$('step').textContent=si+1;$('title').textContent=s[0];$('mood').textContent=s[1];$('sprite').style.backgroundPosition=`${si%2?'100%':'0%'} ${Math.floor(si/2)*25}%`;$('hero').classList.toggle('advanced',si>=4);$('ribbon').textContent=si>=7?'✦ 평화의 빛 ✦':si>=4?'따뜻한 사랑':'작은 시작';if(n){$('next').textContent=n[0];$('remain').textContent=fmt(n[2]-love)+' ♥ 남음';$('bar').style.width=Math.max(4,(love-s[2])/(n[2]-s[2])*100)+'%'}else{$('next').textContent='최종 진화 완료!';$('remain').textContent='사랑이 가득해요';$('bar').style.width='100%'}$('passive').textContent='초당 +'+passive()+' 애정도';$('items').innerHTML=gifts.map(g=>`<button class="item" ${love<price(g)?'disabled':''} onclick="buy('${g[0]}')"><span class="icon">${g[1]}</span><span><b>${g[2]} Lv.${levels[g[0]]||0}</b><small>${g[3]}</small></span><span class="cost">♥ ${fmt(price(g))}</span></button>`).join('');if(si>previous){$('stage').classList.add('burst');setTimeout(()=>$('stage').classList.remove('burst'),1500)}previous=si;persist()}
function begin(){nickname=$('nickname').value.trim()||'빛의 여행자';startedAt=new Date().toISOString();reached={0:startedAt};$('nicknameModal').classList.remove('show');openGame();render()}function openGame(){$('game').hidden=false;$('dock').hidden=false;$('welcome').classList.remove('show')}function buy(id){let g=gifts.find(x=>x[0]===id),p=price(g);if(love<p)return;love-=p;levels[id]=(levels[id]||0)+1;render()}function showRecord(){$('recordList').innerHTML=`<li><i>♥</i><div><b>여정 시작</b><small>${startedAt?date(startedAt):'기록 없음'}</small></div></li>`+stages.map((s,i)=>reached[i]?`<li><i>${i+1}</i><div><b>${s[0]} 첫 도달</b><small>${date(reached[i])}</small></div></li>`:'').join('')}
$('start').onclick=()=>{$('welcome').classList.remove('show');$('nicknameModal').classList.add('show');setTimeout(()=>$('nickname').focus(),100)};$('enter').onclick=begin;$('nickname').onkeydown=e=>{if(e.key==='Enter')begin()};$('hero').onclick=e=>{love+=power();let x=e.offsetX,y=e.offsetY,p=document.createElement('span');p.className='gain';p.textContent='+'+power()+' ♥';p.style.left=x+'px';p.style.top=y+'px';e.currentTarget.append(p);setTimeout(()=>p.remove(),850);render()};$('open').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('profile').onclick=()=>{$('profileName').textContent=nickname;$('profileSince').textContent=startedAt?date(startedAt)+' 시작':'새로운 여정';$('profileModal').classList.add('show')};$('profileClose').onclick=()=>$('profileModal').classList.remove('show');$('recordOpen').onclick=()=>{showRecord();$('profileModal').classList.remove('show');$('recordModal').classList.add('show')};$('recordClose').onclick=()=>$('recordModal').classList.remove('show');[$('profileModal'),$('recordModal')].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});setInterval(()=>{if(nickname&&passive()){love+=passive();render()}},1000);if(nickname){openGame();render()}
</script></body></html>
